stages: [validate, test]

default:
  image: python:3.13.12-slim-bookworm
  before_script:
    - python -m pip install uv==0.9.2
    - uv sync --frozen
  cache:
    key:
      files: [uv.lock]
    paths: [.cache/uv]

variables:
  UV_CACHE_DIR: .cache/uv
  UV_LINK_MODE: copy

lint:
  stage: validate
  script:
    - uv run --frozen ruff check src tests scripts
    - uv run --frozen ruff format --check src tests scripts
    - uv run --frozen mypy src

unit_and_api:
  stage: test
  script:
    - uv run --frozen pytest tests/unit tests/api --junitxml=work/test-results/unit.xml
  artifacts:
    when: always
    reports:
      junit: work/test-results/unit.xml

postgres_integration:
  stage: test
  services:
    - name: postgres:17.5-alpine
      alias: postgres
  variables:
    POSTGRES_USER: payments
    POSTGRES_PASSWORD: payments-local
    POSTGRES_DB: payments
    DATABASE_URL: postgresql+asyncpg://payments:payments-local@postgres:5432/payments
    TEST_DATABASE_URL: postgresql+asyncpg://payments:payments-local@postgres:5432/payments
  script:
    - uv run --frozen alembic upgrade head
    - uv run --frozen alembic check
    - uv run --frozen pytest tests/integration --junitxml=work/test-results/integration.xml
  artifacts:
    when: always
    reports:
      junit: work/test-results/integration.xml
