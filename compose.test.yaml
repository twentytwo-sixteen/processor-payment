services:
  checks:
    image: payment-processor:checks
    build:
      context: .
      dockerfile: Dockerfile.test
    init: true
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://payments:payments-local@postgres:5432/payments
      E2E_API_URL: http://api:8000
      E2E_API_KEY: ${API_KEY:?Copy .env.example to .env}
      E2E_RABBITMQ_URL: amqp://payments:payments-local@rabbitmq:5672/
      E2E_METRICS_URL: http://consumer:9000/metrics
      E2E_COMPOSE_DIR: ${PWD:?Run from the project directory}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:${PWD}:ro
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./migrations:/app/migrations:ro
      - ./work:/app/work
